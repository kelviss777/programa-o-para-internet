<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Questão 3 - Cálculo de IMC</title>
</head>

<body>
    <h1>Questão 3 - Cálculo de IMC com Categoria</h1>

    <form method="POST" action="backend.php">
        <label for="peso">Peso em quilogramas:</label>
        <input type="number" id="peso" name="peso" min="0.01" step="0.01" required>

        <br><br>

        <label for="altura">Altura em metros:</label>
        <input type="number" id="altura" name="altura" min="0.01" step="0.01" required>

        <br><br>

        <button type="submit">Calcular IMC</button>
    </form>
</body>

</html>
