<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Questão 5 - Juros Compostos</title>
</head>

<body>
    <h1>Questão 5 - Cálculo de Juros Compostos</h1>

    <form method="POST" action="backend.php">
        <label for="investimento">Investimento inicial:</label>
        <input type="number" id="investimento" name="investimento" min="0.01" step="0.01" value="1000" required>

        <br><br>

        <label for="taxa">Taxa mensal (%):</label>
        <input type="number" id="taxa" name="taxa" min="0" step="0.01" value="1.5" required>

        <br><br>

        <label for="meses">Quantidade de meses:</label>
        <input type="number" id="meses" name="meses" min="1" step="1" value="12" required>

        <br><br>

        <button type="submit">Simular investimento</button>
    </form>
</body>

</html>
